<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ancestor Journeys</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <div id="sidebar">
    <h1>Ancestor Journeys</h1>
    <div id="root-person"></div>
    <div id="generation-filter">
      <h3>Generations</h3>
      <div id="gen-checkboxes"></div>
    </div>
    <div id="event-filter">
      <h3>Show</h3>
      <label><input type="checkbox" data-event="born" checked> Births</label>
      <label><input type="checkbox" data-event="married" checked> Marriages</label>
      <label><input type="checkbox" data-event="died" checked> Deaths</label>
    </div>
    <div id="person-list">
      <div id="list-tabs">
        <button class="list-tab active" data-tab="people">People <span id="person-count"></span></button>
        <button class="list-tab" data-tab="surnames">Surnames</button>
      </div>
      <div id="people"></div>
      <div id="surnames" class="hidden"></div>
    </div>
  </div>
  <div id="map-container">
    <div id="map"></div>
  </div>
  <div id="info-panel" class="hidden">
    <button id="info-close">&times;</button>
    <div id="info-content"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="src/app.js?v=4"></script>
</body>
</html>
